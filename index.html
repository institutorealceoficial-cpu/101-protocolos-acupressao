<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="101 protocolos de acupressão prontos para consulta rápida."
    />
    <title>101 Protocolos de Acupressão</title>
    <link
      rel="preload"
      href="./assets/product-main.webp"
      as="image"
      type="image/webp"
      fetchpriority="high"
    />
    <link rel="stylesheet" href="./assets/index.css" />
    <!-- UTMify: pixel e captura de parâmetros da campanha -->
    <script>
      window.pixelId = "6a6ae6f789b66c40abdc60b2";
    </script>
    <script>
      window.addEventListener(
        "load",
        () => {
          const loadUtmifyPixel = () => {
            const script = document.createElement("script");
            script.src = "https://cdn.utmify.com.br/scripts/pixel/pixel.js";
            script.async = true;
            script.defer = true;
            document.head.appendChild(script);
          };

          if ("requestIdleCallback" in window) {
            window.requestIdleCallback(loadUtmifyPixel, { timeout: 3000 });
          } else {
            window.setTimeout(loadUtmifyPixel, 1500);
          }
        },
        { once: true },
      );
    </script>
    <script
      src="https://cdn.utmify.com.br/scripts/utms/latest.js"
      data-utmify-prevent-xcod-sck
      data-utmify-prevent-subids
      async
      defer
    ></script>
    <script type="module" src="./assets/index-sEeQ5mTP.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
